[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dupesnap"
version = "1.0.0"
description = "Find and clean duplicate / similar photos. Offline, trash-safe."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["Pillow>=9.0"]

[project.scripts]
dupesnap = "dupesnap:main"

[tool.setuptools]
py-modules = ["dupesnap"]
